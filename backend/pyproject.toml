[project]
name = "fabrica-de-software"
version = "0.1.0"
description = "Orquestra agentes de IA que implementam projetos de software."
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.19,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "gunicorn>=27.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.14",
    "import-linter>=2.5",
    "respx>=0.23.1",
]

[tool.uv]
required-version = ">=0.13.4"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

# Central rodando como na VPS: db, backend e caddy. Só o Caddy publica portas.
# Variáveis vêm do .env (modelo em .env.example). Subir: docker compose up -d --build
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?defina DJANGO_ALLOWED_HOSTS}
      DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
      FABRICA_URL_PUBLICA: ${FABRICA_URL_PUBLICA:?defina FABRICA_URL_PUBLICA}
      FABRICA_CHAVES_COFRE: ${FABRICA_CHAVES_COFRE:?defina FABRICA_CHAVES_COFRE}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # Manda o Host da primeira entrada de DJANGO_ALLOWED_HOSTS, para não depender de "localhost" estar na lista.
        - "import os,sys,urllib.request; h=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.') or 'localhost'; h='localhost' if h=='*' else h; r=urllib.request.Request('http://127.0.0.1:8000/api/saude/', headers={'Host': h}); sys.exit(0 if urllib.request.urlopen(r, timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FABRICA_SITE_CADDY: ${FABRICA_SITE_CADDY:-:80}
    ports:
      - "${FABRICA_PORTA_HTTP:-80}:80"
      - "${FABRICA_PORTA_HTTPS:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:

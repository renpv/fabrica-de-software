        '204':
          description: No response body
  /api/projetos/{id}/conferir/:
    post:
      operationId: projetos_conferir_create
      description: Confere o repositório (etiquetas, webhook) sem alterar nada.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este projeto.
        required: true
      tags:
      - projetos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conferencia'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
  /api/projetos/{id}/preparar/:
    post:
      operationId: projetos_preparar_create
      description: Cria o que falta no repositório. Pode ser repetido.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este projeto.
        required: true
      tags:
      - projetos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conferencia'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
  /api/saude/:
    get:
      operationId: saude_retrieve
      description: Diz se o serviço está no ar. Sem login, para o monitoramento usar.
      tags:
      - saude
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/sessao/:
    get:
      operationId: sessao_retrieve
      description: Login (POST), sessão atual (GET) e logout (DELETE). Entrega o cookie
        `csrftoken`.
      tags:
      - sessao
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: sessao_create
      description: Login (POST), sessão atual (GET) e logout (DELETE). Entrega o cookie
        `csrftoken`.
      tags:
      - sessao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
    delete:
      operationId: sessao_destroy
      description: Login (POST), sessão atual (GET) e logout (DELETE). Entrega o cookie
        `csrftoken`.
      tags:
      - sessao
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/tipos-de-agente/:
    get:
      operationId: tipos_de_agente_list
      description: Os tipos de agente disponíveis, com os campos de cadastro e o passo
        a passo.
      tags:
      - tipos-de-agente
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoDeAgente'
          description: ''
components:
  schemas:
    CampoCadastro:
      type: object
      properties:
        chave:
          type: string
        rotulo:
          type: string
        secreto:
          type: boolean
        ajuda:
          type: string
        obrigatorio:
          type: boolean
      required:
      - ajuda
      - chave
      - obrigatorio
      - rotulo
      - secreto
    Cliente:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
      required:
      - id
      - nome
    ConexaoPlataforma:
      type: object
      description: 'Leitura da conexão. As credenciais nunca saem: só `tem_credenciais`.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          readOnly: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/TipoEnum'
          readOnly: true
        url_base:
          type: string
          readOnly: true
        config:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ConexaoPlataformaStatusEnum'
          readOnly: true
        ultimo_teste_mensagem:
          type: string
          readOnly: true
        tem_credenciais:
          type: boolean
          readOnly: true
      required:
      - config
      - id
      - nome
      - status
      - tem_credenciais
      - tipo
      - ultimo_teste_mensagem
      - url_base
    ConexaoPlataformaStatusEnum:
      enum:
      - nao_testada
      - ok
      - falha
      type: string
      description: |-
        * `nao_testada` - Não testada
        * `ok` - Funcionando
        * `falha` - Com falha
    Conferencia:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemConferencia'
        conferido_em:
          type: string
          format: date-time
          nullable: true
      required:
      - conferido_em
      - itens
    ContaAgente:
      type: object
      description: Conta de agente. `credenciais` só entra; a leitura devolve `tem_credenciais`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
        tipo:
          type: string
        cliente:
          type: string
          format: uuid
          nullable: true
        config: {}
        limite_simultaneo:
          type: integer
          maximum: 32767
          minimum: 0
        status:
          allOf:
          - $ref: '#/components/schemas/ContaAgenteStatusEnum'
          readOnly: true
        ultimo_teste_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ultimo_teste_mensagem:
          type: string
          readOnly: true
        tem_credenciais:
          type: boolean
          readOnly: true
        credenciais:
          writeOnly: true
      required:
      - id
      - nome
      - status
      - tem_credenciais
      - tipo
      - ultimo_teste_em
      - ultimo_teste_mensagem
    ContaAgenteStatusEnum:
      enum:
      - nao_testada
      - ok
      - falha
      - aguardando_runner
      type: string
      description: |-
        * `nao_testada` - Não testada
        * `ok` - Funcionando
        * `falha` - Com falha
        * `aguardando_runner` - Aguardando o runner
    CriarGitLab:
      type: object
      properties:
        nome:
          type: string
          maxLength: 120
        url_base:
          type: string
          maxLength: 200
        token:
          type: string
          writeOnly: true
          maxLength: 500
      required:
      - nome
      - token
      - url_base
    CriarPadrao:
      type: object
      properties:
        executor:
          type: string
          format: uuid
        revisor:
          type: string
          format: uuid
        nome:
          type: string
          default: Padrão
          maxLength: 120
      required:
      - executor
      - revisor
    CriarProjeto:
      type: object
      properties:
        nome:
          type: string
          maxLength: 120
        conexao:
          type: string
          format: uuid
        repositorio_id_externo:
          type: string
          maxLength: 100
        cliente:
          type: string
          format: uuid
          nullable: true
        predefinicao:
          type: string
          format: uuid
          nullable: true
      required:
      - conexao
      - nome
      - repositorio_id_externo
    Duplicar:
      type: object
      properties:
        nome:
          type: string
          maxLength: 120
      required:
      - nome
    Erro:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EtapasEGatilhos:
      type: object
      properties:
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/Rotulo'
        gatilhos:
          type: array
          items:
            $ref: '#/components/schemas/Rotulo'
        metodos:
          type: array
          items:
            $ref: '#/components/schemas/Rotulo'
      required:
      - etapas
      - gatilhos
      - metodos
    ItemConferencia:
      type: object
      properties:
        chave:
          type: string
        titulo:
          type: string
        ok:
          type: boolean
        mensagem:
          type: string
        consertavel:
          type: boolean
      required:
      - chave
      - consertavel
      - mensagem
      - ok
      - titulo
    Login:
      type: object
      properties:
        usuario:
          type: string
        senha:
          type: string
          writeOnly: true
      required:
      - senha
      - usuario
    ManifestoPedido:
      type: object
      properties:
        nome:
          type: string
          maxLength: 26
      required:
      - nome
    ManifestoResposta:
      type: object
      properties:
        acao:
          type: string
          format: uri
        manifesto:
          type: object
          additionalProperties: {}
      required:
      - acao
      - manifesto
    PassoGuia:
      type: object
      properties:
        texto:
          type: string
        link:
          type: string
          nullable: true
      required:
      - link
      - texto
    PatchedCliente:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
    PatchedContaAgente:
      type: object
      description: Conta de agente. `credenciais` só entra; a leitura devolve `tem_credenciais`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
        tipo:
          type: string
        cliente:
          type: string
          format: uuid
          nullable: true
        config: {}
        limite_simultaneo:
          type: integer
          maximum: 32767
          minimum: 0
        status:
          allOf:
          - $ref: '#/components/schemas/ContaAgenteStatusEnum'
          readOnly: true
        ultimo_teste_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ultimo_teste_mensagem:
          type: string
          readOnly: true
        tem_credenciais:
          type: boolean
          readOnly: true
        credenciais:
          writeOnly: true
    PatchedPredefinicao:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        metodo:
          type: string
          maxLength: 40
        etapas: {}
        merge_autonomo:
          type: boolean
    PatchedProjeto:
      type: object
      description: Leitura do projeto. Só `nome`, `cliente`, `predefinicao` e `ativo`
        mudam por PATCH.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
        conexao:
          type: string
          format: uuid
          readOnly: true
        repositorio_caminho:
          type: string
          readOnly: true
        repositorio_id_externo:
          type: string
          readOnly: true
        repositorio_url:
          type: string
          readOnly: true
        cliente:
          type: string
          format: uuid
          nullable: true
        predefinicao:
          type: string
          format: uuid
          nullable: true
        ativo:
          type: boolean
        conferencia:
          readOnly: true
        ultima_conferencia_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        erro_ao_preparar:
          type: string
          readOnly: true
    Predefinicao:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        metodo:
          type: string
          maxLength: 40
        etapas: {}
        merge_autonomo:
          type: boolean
      required:
      - etapas
      - id
      - nome
    Projeto:
      type: object
      description: Leitura do projeto. Só `nome`, `cliente`, `predefinicao` e `ativo`
        mudam por PATCH.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 120
        conexao:
          type: string
          format: uuid
          readOnly: true
        repositorio_caminho:
          type: string
          readOnly: true
        repositorio_id_externo:
          type: string
          readOnly: true
        repositorio_url:
          type: string
          readOnly: true
        cliente:
          type: string
          format: uuid
          nullable: true
        predefinicao:
          type: string
          format: uuid
          nullable: true
        ativo:
          type: boolean
        conferencia:
          readOnly: true
        ultima_conferencia_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        erro_ao_preparar:
          type: string
          readOnly: true
      required:
      - conexao
      - conferencia
      - erro_ao_preparar
      - id
      - nome
      - repositorio_caminho
      - repositorio_id_externo
      - repositorio_url
      - ultima_conferencia_em
    Repositorio:
      type: object
      properties:
        id_externo:
          type: string
        caminho:
          type: string
        url_web:
          type: string
      required:
      - caminho
      - id_externo
      - url_web
    ResultadoTeste:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
        mensagem:
          type: string
      required:
      - mensagem
      - ok
      - status
    Rotulo:
      type: object
      properties:
        chave:
          type: string
        rotulo:
          type: string
      required:
      - chave
      - rotulo
    TesteDaConexao:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
        mensagem:
          type: string
      required:
      - mensagem
      - ok
      - status
    TesteDeDados:
      type: object
      description: Dados de uma conta ainda não salva, para testar a conexão.
      properties:
        tipo:
          type: string
        credenciais:
          writeOnly: true
        config: {}
      required:
      - tipo
    TipoDeAgente:
      type: object
      properties:
        tipo:
          type: string
        nome:
          type: string
        etiqueta:
          type: string
        modelos_sugeridos:
          type: array
          items:
            type: string
        campos:
          type: array
          items:
            $ref: '#/components/schemas/CampoCadastro'
        guia:
          type: array
          items:
            $ref: '#/components/schemas/PassoGuia'
      required:
      - campos
      - etiqueta
      - guia
      - modelos_sugeridos
      - nome
      - tipo
    TipoEnum:
      enum:
      - github
      - gitlab
      type: string
      description: |-
        * `github` - GitHub
        * `gitlab` - GitLab
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

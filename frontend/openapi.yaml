      description: Clientes do dono logado.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este cliente.
        required: true
      tags:
      - clientes
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body

  /api/conexoes-plataforma/github/instalado/:
    get:
      operationId: conexoes_plataforma_github_instalado
      description: 'Volta do GitHub depois de instalar o App: grava a instalação e
        abre a tela no front.'
      parameters:
      - in: query
        name: installation_id
        schema:
          type: string
        required: true
      - in: query
        name: state
        schema:
          type: string
        required: true
      tags:
      - conexoes-plataforma
      security:
      - cookieAuth: []
      responses:
        '302':
          description: No response body
  /api/conexoes-plataforma/github/manifesto/:
    post:
      operationId: conexoes_plataforma_github_manifesto
      description: Gera o manifesto do GitHub App e a URL de criação (o front envia
        por formulário).
      tags:
      - conexoes-plataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestoPedido'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManifestoPedido'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManifestoPedido'
        required: true

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: fabrica
          POSTGRES_PASSWORD: fabrica
          POSTGRES_DB: fabrica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabrica"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fabrica:fabrica@localhost:5432/fabrica
      DJANGO_SECRET_KEY: chave-so-para-o-ci
      FABRICA_URL_PUBLICA: http://localhost:8000
      # Chave Fernet só para o CI; não é usada em nenhum ambiente real.
      FABRICA_CHAVES_COFRE: wE4d6T-2qefhzG4CJH6IH9zc6fx0Bo4LzxoW3Pn9V4I=
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Verificação completa
        run: automacao/verificar.sh

name: Acordar o Cursor

# Acorda a automação do Cursor quando a etiqueta `agente:cursor` entra numa
# issue ou num PR que já tem uma ação (`acao:implementar`, `acao:corrigir`...).
# Quem orquestra põe a ação primeiro e a etiqueta do agente por último.
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

# Um disparo por vez: evita acordar o Cursor duas vezes para o mesmo item.
concurrency:
  group: cursor-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  disparar:
    if: >-
      github.event.label.name == 'agente:cursor'
      && (
        (github.event_name == 'issues' && github.event.issue.pull_request == null
          && contains(join(github.event.issue.labels.*.name, ' '), 'acao:'))
        || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(join(github.event.pull_request.labels.*.name, ' '), 'acao:'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar o webhook da automação do Cursor
        env:
          CURSOR_WEBHOOK_URL: ${{ secrets.CURSOR_WEBHOOK_URL }}
          CURSOR_WEBHOOK_API_KEY: ${{ secrets.CURSOR_WEBHOOK_API_KEY }}
          NUMERO: ${{ github.event.issue.number || github.event.pull_request.number }}
          TITULO: ${{ github.event.issue.title || github.event.pull_request.title }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          ETIQUETAS: ${{ toJSON(github.event_name == 'issues' && github.event.issue.labels.*.name || github.event.pull_request.labels.*.name) }}
        run: |
          acao="$(jq -r '[.[] | select(startswith("acao:")) | ltrimstr("acao:")] | first // ""' <<<"$ETIQUETAS")"
          jq -n \
            --argjson numero "$NUMERO" --arg titulo "$TITULO" \
            --arg url "$URL" --arg acao "$acao" \
            '{numero:$numero, titulo:$titulo, url:$url, acao:$acao}' \
          | curl --fail-with-body -sS -X POST "$CURSOR_WEBHOOK_URL" \
              -H "Authorization: Bearer $CURSOR_WEBHOOK_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @-
